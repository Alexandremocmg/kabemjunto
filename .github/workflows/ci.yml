name: CI

# CI do Kabemjunto
# Roda em todo push e PR para main.
# Falha se: lint quebrado, typecheck quebrado, testes falhando, build quebrado.
#
# Fonte: PLANO-EQUIPE-3DEVS.md §7 (Quality Gates)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores da mesma branch/PR pra economizar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # 1. Lint (ESLint + Prettier)
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 2. Typecheck
      - name: Typecheck
        run: npm run typecheck

      # 3. Testes (com cobertura pra detectar regressão)
      - name: Test with coverage
        run: npm run test:cov

      # 4. Build de produção (shared + server + web)
      - name: Build
        run: npm run build

      # 5. Cobertura: falha se módulos críticos caírem abaixo de 80%
      - name: Verify critical coverage ≥ 80%
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportPath = path.join('coverage', 'coverage-final.json');
          if (!fs.existsSync(reportPath)) {
            console.error('::error::coverage-final.json não encontrado');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const ruleFiles = Object.entries(report).filter(([file]) => {
            const normalizedFile = file.split(path.win32.sep).join('/');
            return normalizedFile.includes('/packages/shared/src/rules/');
          });
          if (ruleFiles.length === 0) {
            console.error('::error::Nenhum arquivo do motor encontrado no relatório de cobertura');
            process.exit(1);
          }
          const totals = ruleFiles.reduce(
            (acc, [, data]) => {
              for (const count of Object.values(data.s ?? {})) {
                acc.found += 1;
                if (count > 0) acc.hit += 1;
              }
              return acc;
            },
            { found: 0, hit: 0 },
          );
          const lines = totals.found === 0 ? 100 : (totals.hit / totals.found) * 100;
          console.log(`Cobertura de linhas do motor: ${lines.toFixed(2)}%`);
          if (lines < 80) {
            console.error(`::error::Cobertura de linhas do motor abaixo de 80% (atual: ${lines.toFixed(2)}%)`);
            process.exit(1);
          }

          const persistenceEntry = Object.entries(report).find(([file]) => {
            const normalizedFile = file.split(path.win32.sep).join('/');
            return normalizedFile.endsWith('/apps/server/src/persistence.ts');
          });
          if (!persistenceEntry) {
            console.error('::error::persistence.ts não encontrado no relatório de cobertura');
            process.exit(1);
          }
          const persistenceCounts = Object.values(persistenceEntry[1].s ?? {});
          const persistenceHit = persistenceCounts.filter((count) => count > 0).length;
          const persistenceCoverage =
            persistenceCounts.length === 0 ? 100 : (persistenceHit / persistenceCounts.length) * 100;
          console.log(`Cobertura de statements da persistência: ${persistenceCoverage.toFixed(2)}%`);
          if (persistenceCoverage < 80) {
            console.error(
              `::error::Cobertura de persistence.ts abaixo de 80% (atual: ${persistenceCoverage.toFixed(2)}%)`,
            );
            process.exit(1);
          }
          NODE

      # 6. Upload da cobertura pro Codecov (opcional, configurável depois)
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build apps
        run: npm run build

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
