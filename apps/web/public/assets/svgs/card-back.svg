<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A252F"/>
      <stop offset="50%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="33%" stop-color="#3498DB"/>
      <stop offset="66%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>
    <pattern id="cardPattern" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="30" height="30" fill="none"/>
      <path d="M 0 15 L 30 15 M 15 0 L 15 30" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="3" fill="rgba(243, 156, 18, 0.15)"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="236" height="336" rx="20" fill="url(#backGrad)" stroke="#34495E" stroke-width="3"/>
  <rect x="12" y="12" width="216" height="316" rx="14" fill="url(#cardPattern)" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <g transform="translate(120, 170)">
    <rect x="-65" y="-65" width="130" height="130" rx="24" fill="#151E28" stroke="url(#accentGrad)" stroke-width="3.5" transform="rotate(45)"/>
    <circle cx="0" cy="-60" r="10" fill="#F39C12"/>
    <circle cx="60" cy="0" r="10" fill="#3498DB"/>
    <circle cx="0" cy="60" r="10" fill="#27AE60"/>
    <circle cx="-60" cy="0" r="10" fill="#9B59B6"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="2">KABEM</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#F39C12" letter-spacing="2">JUNTO</text>
    <path d="M-15,32 L0,22 L15,32 L0,42 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>
  <text x="24" y="38" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#F39C12">KJ</text>
  <text x="216" y="318" text-anchor="end" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#3498DB">KJ</text>
</svg>
